name: Feature request
description: Suggest a focused improvement to RepoQuest.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What becomes easier, clearer, or more enjoyable with this change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the behavior from a user's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include simpler approaches or workarounds if relevant.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This idea preserves a useful no-backend experience, or explains why a backend is necessary.
        - label: I considered keyboard, touch, and responsive behavior.
        - label: I searched existing issues and roadmap items first.
          required: true
